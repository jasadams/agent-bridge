[package]
name = "agent-bridge"
version = "0.2.0"
edition = "2024"
description = "Durable local and peer messaging for native Claude Code and Codex sessions"
rust-version = "1.94"
license = "GPL-3.0-or-later"
repository = "https://github.com/jasadams/agent-bridge"

[profile.release]
lto = "thin"
strip = true

[dependencies]
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache", "unstable-rendered-line-info"] }
crossterm = { version = "=0.29.0", default-features = false, features = ["events", "event-stream", "bracketed-paste"] }
tui-markdown = { version = "=0.3.12", default-features = false }
pulldown-cmark = { version = "=0.13.5", default-features = false }
schemars = "=1.2.3"
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "macros", "schemars", "transport-io"] }
anyhow = "1.0.104"
base64 = "0.22.1"
clap = { version = "4.6.7", features = ["derive"] }
fs2 = "0.4.3"
either = "1.16"
rand = "0.10"
futures = "0.3"
futures-util = { version = "0.3.34", default-features = false, features = ["std", "sink"] }
libc = "0.2.191"
libp2p = { version = "=0.57.1", default-features = false, features = ["tokio", "quic", "request-response", "ed25519", "macros", "mdns", "relay", "rendezvous", "identify", "noise", "yamux", "dcutr", "autonat", "tcp", "dns"] }
libp2p-identity = { version = "=0.3.0", default-features = false, features = ["ed25519", "rand", "peerid"] }
notify = "8"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
jsonc-parser = { version = "=0.34.0", features = ["cst", "serde_json"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
uuid = { version = "1.28.0", features = ["v4"] }
zeroize = "1.9.1"
sha2 = "=0.11.1"
vodozemac = { version = "=0.11.1", default-features = false }

qrcode = { version = "=0.14.1", default-features = false, features = ["svg"] }
hyper = { version = "=1.12.0", features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
http-body-util = "=0.1.5"
serde_urlencoded = "=0.7.1"
subtle = "=2.6.1"
unicode-general-category = "=1.1.0"
url = "=2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
quircs = "=0.10.3"

[patch.crates-io]
libp2p-mdns = { path = "vendor/libp2p-mdns" }

libp2p-rendezvous = { path = "vendor/libp2p-rendezvous" }

libp2p-autonat = { path = "vendor/libp2p-autonat" }
libp2p-dcutr = { path = "vendor/libp2p-dcutr" }

libp2p-relay = { path = "vendor/libp2p-relay" }

ratatui-core = { path = "vendor/ratatui-core" }
