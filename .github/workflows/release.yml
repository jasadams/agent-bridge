name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
  queue: max

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_VERSION: 1.98.0

jobs:
  metadata:
    name: Validate release version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve version and verify release ancestry
        id: version
        run: python3 tools/release_version.py --github-output "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.asset }}
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            asset: agent-bridge-linux-x86_64
          - runner: ubuntu-22.04-arm
            asset: agent-bridge-linux-aarch64
          - runner: macos-15-intel
            asset: agent-bridge-macos-x86_64
          - runner: macos-14
            asset: agent-bridge-macos-aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      AGENT_BRIDGE_BUILD_VERSION: ${{ needs.metadata.outputs.version }}
      AGENT_BRIDGE_BUILD_COMMIT: ${{ needs.metadata.outputs.commit }}
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify selected source commit
        env:
          EXPECTED_COMMIT: ${{ needs.metadata.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_VERSION"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - name: Validate pinned OpenCode V1 plugin
        working-directory: plugins/opencode
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun test
      - name: Validate source and installer
        run: |
          cargo fmt --check
          rustfmt --edition 2024 --check --config skip_children=true vendor/ratatui-core/src/buffer/diff.rs vendor/ratatui-core/src/text/span.rs vendor/ratatui-widgets/src/paragraph.rs vendor/tui-markdown/src/lib.rs vendor/tui-markdown/src/links.rs vendor/tui-markdown/src/renderer/mod.rs vendor/tui-markdown/src/renderer/link.rs vendor/tui-markdown/src/renderer/table.rs
          cargo test --locked
          python3 tools/test_board_links.py --binary target/debug/agent-bridge
          cargo test --locked --manifest-path vendor/ratatui-core/Cargo.toml --target-dir target --lib --no-fail-fast buffer::
          cargo clippy --locked --manifest-path vendor/ratatui-core/Cargo.toml --target-dir target --lib -- -D warnings
          cargo test --locked --manifest-path vendor/tui-markdown/Cargo.toml --target-dir target --no-default-features --lib --no-fail-fast
          cargo test --locked --manifest-path vendor/ratatui-widgets/Cargo.toml --target-dir target --no-default-features --lib --no-fail-fast paragraph
          cargo clippy --locked --manifest-path vendor/tui-markdown/Cargo.toml --target-dir target --no-default-features --lib -- -D warnings
          cargo clippy --locked --manifest-path vendor/ratatui-widgets/Cargo.toml --target-dir target --no-default-features --lib -- -D warnings
          cargo test --locked --manifest-path vendor/libp2p-relay/Cargo.toml --target-dir target
          cargo clippy --all-targets --locked -- -D warnings
          cargo fmt --manifest-path vendor/libp2p-relay/Cargo.toml --check
          cargo clippy --locked --manifest-path vendor/libp2p-relay/Cargo.toml --all-targets --target-dir target -- -D warnings
          sh -n install.sh
          python3 tools/test_installer.py
          python3 tools/test_packaging.py
          python3 tools/test_release.py
      - name: Build portable release executable
        if: needs.metadata.outputs.release == 'true'
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          cargo build --release --locked
          mkdir -p dist
          cp target/release/agent-bridge "dist/$ASSET"
          if [ "$(uname -s)" = Darwin ]; then
            codesign --force --sign - "dist/$ASSET"
          fi
          test "$("dist/$ASSET" --version)" = "agent-bridge $AGENT_BRIDGE_BUILD_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.metadata.outputs.release == 'true'
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: [metadata, build]
    if: github.repository == 'jasadams/agent-bridge' && needs.metadata.outputs.release == 'true' && github.event_name == 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    # Serializing only by tag would allow an older version to race a newer
    # version while each decides which release should be marked Latest.
    concurrency:
      group: release-publication
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Recheck release tag and main ancestry
        run: |
          python3 tools/release_version.py
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: agent-bridge-*
          merge-multiple: true
          path: dist
      - name: Install pinned source packaging toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: Package corresponding source and dependency notices
        run: python3 tools/package_release.py --dist dist --commit "$RELEASE_COMMIT" --version "$RELEASE_VERSION"
      - name: Publish immutable semantic release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 tools/release_publish.py --dist dist --commit "$RELEASE_COMMIT" --tag "v$RELEASE_VERSION"
